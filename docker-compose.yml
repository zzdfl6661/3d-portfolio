services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SQLITE_PATH: /app/data/site.db
    ports:
      # No domain/reverse proxy yet: access with http://SERVER_IP:3000
      - "3000:3000"
    volumes:
      # Keep articles and guestbook messages across container rebuilds.
      - ./data:/app/data
